[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quantem-checker"
version = "0.2.0a1"
description = "Local temporal pipeline probes, supplied-clock and portfolio-ledger audits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quantem Research" }]
keywords = ["backtesting", "quant", "finance", "machine-learning", "lookahead", "leakage", "evaluation"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
parquet = ["pandas>=2", "pyarrow>=14"]
dev = ["pytest>=7", "build", "wheel", "twine", "ruff"]

[project.scripts]
quantem-checker = "quantem_checker.__main__:main"

[project.urls]
Homepage = "https://quantem.finance"

[tool.setuptools.packages.find]
include = ["quantem_checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
